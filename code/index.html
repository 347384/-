<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个性化课表管理助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>个性化课表管理助手</h1>
  </header>
  <main>
    <section id="form-section">
      <h2>添加课程</h2>
      <form id="course-form">
        <label for="course-name">课程名称:</label>
        <input type="text" id="course-name" required>
        <label for="course-day">上课日期:</label>
        <select id="course-day" required>
          <option value="周一">周一</option>
          <option value="周二">周二</option>
          <option value="周三">周三</option>
          <option value="周四">周四</option>
          <option value="周五">周五</option>
        </select>
        <label for="start-time">开始时间:</label>
        <input type="time" id="start-time" required>
        <label for="end-time">结束时间:</label>
        <input type="time" id="end-time" required>
        <button type="submit">添加课程</button>
      </form>
    </section>
    <section id="schedule-section">
      <h2>课表</h2>
      <ul id="schedule-list">
        <!-- 动态生成的课程列表 -->
      </ul>
    </section>
    <section id="notes-section">
      <h2>课程笔记</h2>
      <form id="note-form">
        <label for="note-title">笔记标题:</label>
        <input type="text" id="note-title" required>
        <label for="note-content">笔记内容:</label>
        <textarea id="note-content" required></textarea>
        <button type="submit">保存笔记</button>
      </form>
      <ul id="notes-list">
        <!-- 动态生成的笔记列表 -->
      </ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
